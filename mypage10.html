<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
        /* Selector: Adjacent Selector */
        /* S1 + S2 = S2 ที่อยู่ต่อจาก S1 เพียงตัวเดียว */
        #aa+p {
            color: rgb(72, 226, 72);
        }
    </style>
</head>

<body>
    <div id="aa">
        <p>111111</p>
        <p>222222</p>
        <span>HELLO</span>
        <div id="bb">
            <p>333333</p>
            <div id="cc">
                <p>444444</p>
                <span>HI</span>
            </div>
            <p>555555</p>
        </div>
        <p>666666</p>
    </div>
    <p>777777</p>
    <p>888888</p>
    <span>HEY</span>
</body>

</html>
